<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Driver</title>
    <meta
      name="description"
      content="Bus Driver — 90s Bollywood bangers that play at Indian barber shops."
    />

    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="page">
      <div class="top-row">
        <span class="clock" id="clock"
          >--<span class="clock__colon">:</span>--</span
        >

        <div class="listeners" role="status">
          <span class="listeners__dot" aria-hidden="true"></span>
          <span class="listeners__count" id="listenerCount">30</span>
          <span class="listeners__label">online</span>
        </div>

        <nav class="platform-links" aria-label="Listen on other platforms">
          <!-- Swap this href for your real YT Music playlist link -->
          <a
            class="pill"
            href="https://music.youtube.com/playlist?list=PLTJ1PnzCWyFw"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="assets/icons/ytmusic.svg" alt="" class="pill__icon" />
            <span>YT Music</span>
            <svg class="pill__external" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 17 17 7M9 7h8v8" />
            </svg>
          </a>
          
          <a
            class="pill"
            href="https://open.spotify.com/playlist/3iYHVXAyUepzzNPKaGn3p1"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="assets/icons/spotify.svg" alt="" class="pill__icon" />
            <span>Spotify</span>
            <svg class="pill__external" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 17 17 7M9 7h8v8" />
            </svg>
          </a>
        </nav>
      </div>
    </main>

    <section class="player-bar" aria-label="Now playing">
      <div class="player-bar__disc" id="disc">
        <img
          id="coverArt"
          class="player-bar__cover"
          src="assets/backgrounds/bus-cockpit.jpg"
          alt="Album artwork"
        />
        <span class="player-bar__hole" aria-hidden="true"></span>
      </div>

      <div class="player-bar__info">
        <p class="track-title" id="trackTitle">Press play to start the radio</p>
        <div class="player-bar__subrow">
          <span class="eq" id="eq" aria-hidden="true">
            <span class="eq__bar"></span>
            <span class="eq__bar"></span>
            <span class="eq__bar"></span>
          </span>
          <span class="track-artist" id="trackArtist">Bus Driver Radio</span>
        </div>

        <div class="progress" id="progressTrack">
          <div class="progress__fill" id="progressFill"></div>
        </div>
        <div class="progress__time">
          <span id="currentTime">0:00</span>
          <span class="time-divider" aria-hidden="true">/</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="player-bar__controls">
        <button
          class="control-btn control-btn--prev"
          id="prevTrack"
          type="button"
          aria-label="Previous track"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 5v14L8 12l10-7zM6 5v14H4V5h2z" />
          </svg>
        </button>
        <button
          class="control-btn control-btn--play"
          id="playToggle"
          type="button"
          aria-pressed="false"
          aria-label="Play"
        >
          <svg class="icon icon--play" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 4.5v15l14-7.5-14-7.5z" />
          </svg>
          <svg class="icon icon--pause" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 4.5h4v15H6v-15zm8 0h4v15h-4v-15z" />
          </svg>
        </button>
        <button
          class="control-btn control-btn--next"
          id="nextTrack"
          type="button"
          aria-label="Next track"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 5v14l10-7L6 5zm11 0v14h2V5h-2z" />
          </svg>
        </button>
      </div>

      <!-- The actual YouTube player. Shrunk to 2x2px (not display:none —
         YouTube's embed terms require the player to stay on-page) so
         only the disc art and custom controls are visible. -->
      <div class="yt-player" id="ytPlayer" aria-hidden="true"></div>
    </section>

    <!-- Our own script first, so it's ready to receive the API's callback -->
    <script src="js/app.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
  </body>
</html>
